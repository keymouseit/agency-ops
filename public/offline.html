<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f9fafb" />
    <meta name="color-scheme" content="light only" />
    <title>Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: #f9fafb;
        color: #111827;
        padding: 24px;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        font-weight: 650;
      }
      p {
        margin: 0 0 20px;
        color: #4b5563;
        line-height: 1.5;
        font-size: 0.95rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        background: #111827;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 10px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Check your internet connection and try again. Agency Ops needs a network connection for live data.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
